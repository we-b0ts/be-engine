[package]
name = "traffic-protocol-redis"
version.workspace = true
edition.workspace = true

[dependencies]
traffic-codec-json = { workspace = true }
sha2 = { workspace = true }
traffic-value = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
traffic-model = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v4"] }
traffic-contract = { workspace = true }
serde = { workspace = true, features = ["derive"] }
traffic-protocol = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
redis-protocol = { workspace = true, features = ["bytes"] }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
