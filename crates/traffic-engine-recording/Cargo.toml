[package]
name = "traffic-engine-recording"
version = "0.1.0"
edition = "2024"
description = "Standalone recording and Source runtime"

[features]
test-support = ["dep:tempfile", "traffic-engine-verification/test-support", "traffic-recorder/test-support"]

[dependencies]
traffic-engine-verification = { path = "../traffic-engine-verification" }
traffic-engine-replay = { path = "../traffic-engine-replay" }
traffic-engine-evidence = { path = "../traffic-engine-evidence" }
traffic-engine-config = { path = "../traffic-engine-config" }
traffic-recording-model = { path = "../traffic-recording-model" }
traffic-engine-environment = { path = "../traffic-engine-environment" }
traffic-recorder = { path = "../traffic-recorder" }
traffic-model = { path = "../traffic-model" }
traffic-protocol = { path = "../traffic-protocol" }
traffic-protocol-http = { path = "../traffic-protocol-http" }
traffic-replay = { path = "../traffic-replay" }
traffic-protocol-mysql = { path = "../traffic-protocol-mysql" }
anyhow = "1"
base64 = "0.22"
# Recorder leases remain compatible with gateway 0.2.14. Later SDKs pull
# brz-json/preserve_order into the engine and change persisted JSON identities.
brz-http-gateway = { version = "=0.2.12", features = ["redis-recording"] }
brz-redis = { version = "=0.0.16" }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
sha2 = "0.10"
http-body-util = "0.1"
http-body = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", features = ["http1", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
tower-service = "0.3"
libc = "0.2"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webpki-roots = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = { version = "3", optional = true }


[dev-dependencies]
tempfile = "3"
