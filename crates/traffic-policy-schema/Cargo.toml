[package]
name = "traffic-policy-schema"
version = "0.1.0"
edition = "2024"

[features]
cli = ["dep:clap"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
base64 = "0.22"
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
traffic-jwt = { path = "../traffic-jwt" }
traffic-policy = { path = "../traffic-policy" }
traffic-value = { path = "../traffic-value" }
traffic-time = { path = "../traffic-time" }
traffic-codec-json = { path = "../traffic-codec-json" }
traffic-protocol = { path = "../traffic-protocol" }
traffic-protocol-http = { path = "../traffic-protocol-http" }
traffic-protocol-mysql = { path = "../traffic-protocol-mysql" }
traffic-protocol-redis = { path = "../traffic-protocol-redis" }
traffic-codec-protobuf = { path = "../traffic-codec-protobuf" }
traffic-contract = { path = "../traffic-contract" }
traffic-response-rewrite = { path = "../traffic-response-rewrite" }
url = "2"

[dev-dependencies]
traffic-extensions = { path = "../traffic-extensions" }
serde_yaml = "0.9"
