[package]
name = "traffic-engine"
version = "0.1.0"
edition = "2024"
build = "../../build.rs"

[features]
test-support = ["traffic-engine-e2erun/test-support", "traffic-engine-recording/test-support", "traffic-engine-verification/test-support", "traffic-engine-replay/test-support", "traffic-engine-evidence/test-support", "traffic-engine-config/test-support", "traffic-engine-policy/test-support", "traffic-engine-environment/test-support", "dep:tempfile", "traffic-recorder/test-support", "traffic-recording-store/test-support", "traffic-contract/test-support", "traffic-policy-execution/test-support", "traffic-protocol-mysql/test-support"]

[dependencies]
traffic-engine-e2erun = { path = "../traffic-engine-e2erun" }
traffic-engine-recording = { path = "../traffic-engine-recording" }
traffic-engine-verification = { path = "../traffic-engine-verification" }
traffic-engine-replay = { path = "../traffic-engine-replay" }
traffic-engine-evidence = { path = "../traffic-engine-evidence" }
traffic-engine-config = { path = "../traffic-engine-config" }
traffic-engine-policy = { path = "../traffic-engine-policy" }
traffic-engine-environment = { path = "../traffic-engine-environment" }
traffic-recorder = { path = "../traffic-recorder" }
traffic-policy-execution = { path = "../traffic-policy-execution" }
traffic-policy-compiler = { path = "../traffic-policy-compiler" }
traffic-contract = { path = "../traffic-contract" }
traffic-policy-value = { path = "../traffic-policy-value" }
traffic-policy = { path = "../traffic-policy" }
traffic-extensions = { path = "../traffic-extensions" }
traffic-protocol = { path = "../traffic-protocol" }
traffic-protocol-http = { path = "../traffic-protocol-http" }
traffic-recording-store = { path = "../traffic-recording-store" }
traffic-protocol-mysql = { path = "../traffic-protocol-mysql" }
traffic-protocol-redis = { path = "../traffic-protocol-redis" }
anyhow = "1"
base64 = "0.22"
# Recorder leases remain compatible with gateway 0.2.14. Later SDKs pull
# brz-json/preserve_order into the engine and change persisted JSON identities.
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", features = ["sink"] }
jsonwebtoken = { version = "9.3", default-features = false }
sha2 = "0.10"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = { version = "3", optional = true }

[dev-dependencies]
traffic-engine-e2erun = { path = "../traffic-engine-e2erun", features = ["test-support"] }
traffic-engine-recording = { path = "../traffic-engine-recording", features = ["test-support"] }
traffic-engine-verification = { path = "../traffic-engine-verification", features = ["test-support"] }
traffic-engine-replay = { path = "../traffic-engine-replay", features = ["test-support"] }
traffic-engine-evidence = { path = "../traffic-engine-evidence", features = ["test-support"] }
traffic-engine-config = { path = "../traffic-engine-config", features = ["test-support"] }
traffic-engine-policy = { path = "../traffic-engine-policy", features = ["test-support"] }
traffic-engine-environment = { path = "../traffic-engine-environment", features = ["test-support"] }
traffic-recorder = { path = "../traffic-recorder", features = ["test-support"] }
traffic-policy-execution = { path = "../traffic-policy-execution", features = ["test-support"] }
traffic-recording-store = { path = "../traffic-recording-store", features = ["test-support"] }
traffic-protocol-fixture = { path = "../traffic-protocol-fixture" }
traffic-contract = { path = "../traffic-contract", features = ["test-support"] }
traffic-protocol-mysql = { path = "../traffic-protocol-mysql", features = ["test-support"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "chrono", "bigdecimal"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
