[package]
name = "traffic-e2e-target-template"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
brz-logs = { version = "=0.0.6", features = ["metrics"] }
http-server = { package = "brz-http-server", version = "=0.0.13", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"

[profile.release]
lto = "thin"
