[package]
name = "traffic-contract"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
traffic-value = { path = "../traffic-value" }
traffic-policy = { path = "../traffic-policy" }
traffic-time = { path = "../traffic-time" }
traffic-codec-json = { path = "../traffic-codec-json" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
traffic-extensions = { path = "../traffic-extensions", default-features = false, features = ["policy-unordered", "policy-time", "policy-identity"] }
