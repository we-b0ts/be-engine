[package]
name = "traffic-engine-policy"
version = "0.1.0"
edition = "2024"
description = "Installed policy declarations and compilation"

[features]
test-support = []

[dependencies]
traffic-policy-execution = { path = "../traffic-policy-execution" }
traffic-policy-document = { path = "../traffic-policy-document" }
traffic-policy-compiler = { path = "../traffic-policy-compiler" }
traffic-jwt = { path = "../traffic-jwt" }
traffic-policy-schema = { path = "../traffic-policy-schema", features = ["cli"] }
traffic-contract = { path = "../traffic-contract" }
traffic-policy-value = { path = "../traffic-policy-value" }
traffic-policy = { path = "../traffic-policy" }
traffic-codec-protobuf = { path = "../traffic-codec-protobuf" }
traffic-extensions = { path = "../traffic-extensions" }
traffic-protocol-http = { path = "../traffic-protocol-http" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
url = "2"
tempfile = { version = "3", optional = true }

[dev-dependencies]
traffic-engine-config = { path = "../traffic-engine-config" }
traffic-engine-evidence = { path = "../traffic-engine-evidence" }
hyper = { version = "1", features = ["client", "http1", "server"] }
tempfile = "3"
