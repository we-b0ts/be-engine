[package]
name = "traffic-rewrite-review"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
sha2 = "0.10"
traffic-engine = { path = "../traffic-engine" }
traffic-rewrite-model = { path = "../traffic-rewrite-model" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3"
traffic-engine = { path = "../traffic-engine", features = ["test-support"] }
