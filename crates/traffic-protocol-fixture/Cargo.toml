[package]
name = "traffic-protocol-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }
traffic-model = { path = "../traffic-model" }
traffic-protocol = { path = "../traffic-protocol" }
uuid = { version = "1", features = ["v4", "serde"] }
