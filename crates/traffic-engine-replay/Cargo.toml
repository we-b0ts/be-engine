[package]
name = "traffic-engine-replay"
version = "0.1.0"
edition = "2024"
description = "Replay services and native inventory adapters"

[features]
test-support = ["traffic-engine-evidence/test-support"]

[dependencies]
traffic-engine-evidence = { path = "../traffic-engine-evidence" }
traffic-engine-config = { path = "../traffic-engine-config" }
traffic-engine-policy = { path = "../traffic-engine-policy" }
traffic-engine-environment = { path = "../traffic-engine-environment" }
traffic-policy-compiler = { path = "../traffic-policy-compiler" }
traffic-policy-schema = { path = "../traffic-policy-schema", features = ["cli"] }
traffic-contract = { path = "../traffic-contract" }
traffic-policy-value = { path = "../traffic-policy-value" }
traffic-value = { path = "../traffic-value" }
traffic-extensions = { path = "../traffic-extensions" }
traffic-model = { path = "../traffic-model" }
traffic-protocol = { path = "../traffic-protocol" }
traffic-protocol-http = { path = "../traffic-protocol-http" }
traffic-replay = { path = "../traffic-replay" }
traffic-protocol-mysql = { path = "../traffic-protocol-mysql" }
traffic-protocol-redis = { path = "../traffic-protocol-redis" }
anyhow = "1"
base64 = "0.22"
# Recorder leases remain compatible with gateway 0.2.14. Later SDKs pull
# brz-json/preserve_order into the engine and change persisted JSON identities.
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", features = ["sink"] }
sha2 = "0.10"
hyper = { version = "1", features = ["client", "http1", "server"] }
libc = "0.2"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
x509-parser = "0.16"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = { version = "3", optional = true }


[dev-dependencies]
traffic-engine-recording = { path = "../traffic-engine-recording", features = ["test-support"] }
traffic-protocol-fixture = { path = "../traffic-protocol-fixture" }
tempfile = "3"
