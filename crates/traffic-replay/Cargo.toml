[package]
name = "traffic-replay"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "io-util"] }
anyhow = "1"
traffic-model = { path = "../traffic-model" }
traffic-contract = { path = "../traffic-contract" }
traffic-protocol = { path = "../traffic-protocol" }
bytes = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
