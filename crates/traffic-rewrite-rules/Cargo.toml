[package]
name = "traffic-rewrite-rules"
version = "0.1.0"
edition = "2024"

[features]
test-support = ["traffic-rewrite-model/test-support"]

[dependencies]
traffic-rewrite-runtime = { path = "../traffic-rewrite-runtime" }
traffic-rewrite-model = { path = "../traffic-rewrite-model" }
traffic-engine = { path = "../traffic-engine" }
traffic-policy = { path = "../traffic-policy" }
traffic-value = { path = "../traffic-value" }
traffic-protocol = { path = "../traffic-protocol" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hyper = { version = "1", features = ["client", "http1", "server"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }


[dev-dependencies]
tempfile = "3"
traffic-engine = { path = "../traffic-engine", features = ["test-support"] }
