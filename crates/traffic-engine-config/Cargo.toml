[package]
name = "traffic-engine-config"
version = "0.1.0"
edition = "2024"
description = "Recorder configuration and Source policy projection"

[features]
test-support = ["dep:tempfile", "traffic-engine-environment/test-support"]

[dependencies]
traffic-recording-model = { path = "../traffic-recording-model" }
traffic-engine-policy = { path = "../traffic-engine-policy" }
traffic-engine-environment = { path = "../traffic-engine-environment" }
traffic-recorder = { path = "../traffic-recorder" }
traffic-codec-json = { path = "../traffic-codec-json" }
traffic-policy-compiler = { path = "../traffic-policy-compiler" }
traffic-policy-schema = { path = "../traffic-policy-schema", features = ["cli"] }
traffic-contract = { path = "../traffic-contract" }
traffic-policy-value = { path = "../traffic-policy-value" }
traffic-policy = { path = "../traffic-policy" }
traffic-value = { path = "../traffic-value" }
traffic-extensions = { path = "../traffic-extensions" }
traffic-response-rewrite = { path = "../traffic-response-rewrite" }
traffic-model = { path = "../traffic-model" }
traffic-protocol = { path = "../traffic-protocol" }
traffic-protocol-http = { path = "../traffic-protocol-http" }
traffic-protocol-mysql = { path = "../traffic-protocol-mysql" }
traffic-protocol-redis = { path = "../traffic-protocol-redis" }
anyhow = "1"
base64 = "0.22"
# Recorder leases remain compatible with gateway 0.2.14. Later SDKs pull
# brz-json/preserve_order into the engine and change persisted JSON identities.
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
md-5 = "0.10"
sha2 = "0.10"
hyper = { version = "1", features = ["client", "http1", "server"] }
motan-codec = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
motan-protocol = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
redis-protocol = { version = "6", features = ["bytes"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = { version = "3", optional = true }


[dev-dependencies]
traffic-engine-replay = { path = "../traffic-engine-replay", features = ["test-support"] }
tempfile = "3"
