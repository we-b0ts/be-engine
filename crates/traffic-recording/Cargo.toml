[package]
name = "traffic-recording"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
anyhow = "1"
traffic-model = { path = "../traffic-model" }
traffic-protocol = { path = "../traffic-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
