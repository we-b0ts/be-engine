[dependencies]
anyhow = "1"
traffic-model = { path = "../traffic-model" }
traffic-protocol = { path = "../traffic-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
