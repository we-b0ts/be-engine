[package]
name = "traffic-protocol-http"
version = "0.1.0"
edition = "2024"

[dependencies]
traffic-contract = { path = "../traffic-contract" }
traffic-policy-value = { path = "../traffic-policy-value" }
bytes = "1"
base64 = "0.22"
flate2 = "1"
serde_json = "1"
traffic-model = { path = "../traffic-model" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
traffic-protocol = { path = "../traffic-protocol" }
traffic-replay = { path = "../traffic-replay" }
traffic-codec-json = { path = "../traffic-codec-json" }
anyhow = "1"
httparse = "1"
hyper-rustls = { version = "0.27", features = ["http1", "webpki-roots"] }
tower-service = "0.3"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client", "http1", "tokio"] }
http-body = "1"
http-body-util = "0.1"
form_urlencoded = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "net", "sync", "time"] }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
url = "2"

futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
