[package]
name = "traffic-protocol-http"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
base64 = "0.22"
flate2 = "1"
serde_json = "1"
traffic-model = { path = "../traffic-model" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
traffic-protocol = { path = "../traffic-protocol" }
anyhow = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body = "1"
tokio = { version = "1", features = ["io-util"] }
serde = { version = "1", features = ["derive"] }
