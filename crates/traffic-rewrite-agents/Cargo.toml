[package]
name = "traffic-rewrite-agents"
version = "0.1.0"
edition = "2024"

[dependencies]
traffic-engine = { path = "../traffic-engine" }
traffic-rewrite-model = { path = "../traffic-rewrite-model" }
traffic-rewrite-review = { path = "../traffic-rewrite-review" }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
