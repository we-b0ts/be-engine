[package]
name = "traffic-replay-runtime"
version = "0.1.0"
edition = "2024"

[features]
test-support = ["traffic-engine/test-support", "dep:base64", "dep:hyper"]

[dependencies]
traffic-engine = { path = "../traffic-engine" }
traffic-contract = { path = "../traffic-contract" }
traffic-value = { path = "../traffic-value" }
traffic-model = { path = "../traffic-model" }
traffic-protocol = { path = "../traffic-protocol" }
traffic-replay = { path = "../traffic-replay" }
anyhow = "1"
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", features = ["sink"] }
hyper = { version = "1", features = ["client", "http1", "server"], optional = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
traffic-contract = { path = "../traffic-contract", features = ["test-support"] }
traffic-engine = { path = "../traffic-engine", features = ["test-support"] }
traffic-policy-value = { path = "../traffic-policy-value" }
traffic-protocol-fixture = { path = "../traffic-protocol-fixture" }
traffic-protocol-http = { path = "../traffic-protocol-http" }
traffic-protocol-mysql = { path = "../traffic-protocol-mysql", features = ["test-support"] }
traffic-protocol-redis = { path = "../traffic-protocol-redis" }
rustls = "0.23"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
hyper = { version = "1", features = ["client", "http1", "server"] }
