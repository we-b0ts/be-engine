[package]
name = "traffic-jwt"
version = "0.1.0"
edition = "2024"

[dependencies]
jsonwebtoken = { version = "9.3", default-features = false }
rustls-pemfile = "2"
x509-parser = "0.16"
anyhow = "1"
base64 = "0.22"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
traffic-codec-json = { path = "../traffic-codec-json" }
traffic-time = { path = "../traffic-time" }
uuid = "1"
