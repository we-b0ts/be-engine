[package]
name = "traffic-protocol-redis"
version = "0.1.0"
edition = "2024"

[dependencies]
traffic-policy = { path = "../traffic-policy" }
traffic-policy-value = { path = "../traffic-policy-value" }
base64 = "0.22"
serde_json = "1"
traffic-model = { path = "../traffic-model" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
traffic-contract = { path = "../traffic-contract" }
serde = { version = "1", features = ["derive"] }
traffic-protocol = { path = "../traffic-protocol" }
anyhow = "1"
bytes = "1"
redis-protocol = { version = "6", features = ["bytes"] }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util"] }
