[package]
name = "traffic-rewrite-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
traffic-engine = { path = "../traffic-engine" }
traffic-rewrite-model = { path = "../traffic-rewrite-model" }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
