[package]
name = "traffic-codec-json"
version = "0.1.0"
edition = "2024"

[dependencies]
traffic-value = { path = "../traffic-value" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
traffic-codec-protobuf = { path = "../traffic-codec-protobuf" }
traffic-codec-string = { path = "../traffic-codec-string" }
traffic-codec-bytes = { path = "../traffic-codec-bytes" }
