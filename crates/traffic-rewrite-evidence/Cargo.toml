[package]
name = "traffic-rewrite-evidence"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
chrono = "0.4"
traffic-value = { path = "../traffic-value" }
traffic-protocol = { path = "../traffic-protocol" }
traffic-engine = { path = "../traffic-engine" }
traffic-rewrite-model = { path = "../traffic-rewrite-model" }
traffic-rewrite-rules = { path = "../traffic-rewrite-rules" }
traffic-rewrite-review = { path = "../traffic-rewrite-review" }
anyhow = "1"
base64 = "0.22"
hyper = "1"
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
traffic-protocol-mysql = { path = "../traffic-protocol-mysql", features = ["test-support"] }
sha2 = "0.10"
traffic-policy = { path = "../traffic-policy" }
tempfile = "3"
traffic-engine = { path = "../traffic-engine", features = ["test-support"] }
