[package]
name = "traffic-policy-generated"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = "1"
traffic-contract = { path = "../traffic-contract" }
traffic-policy-compiler = { path = "../traffic-policy-compiler" }
traffic-policy-execution = { path = "../traffic-policy-execution" }
traffic-policy-schema = { path = "../traffic-policy-schema" }
traffic-policy-value = { path = "../traffic-policy-value" }

[dev-dependencies]
chrono = "0.4"
traffic-policy = { path = "../traffic-policy" }
traffic-extensions = { path = "../traffic-extensions" }
