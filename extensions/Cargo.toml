[package]
name = "traffic-extensions"
version.workspace = true
edition.workspace = true

[features]
default = ["codec-json", "codec-protobuf", "codec-string", "codec-bytes", "policy-unordered", "policy-time", "policy-identity", "policy-response-rewrite", "protocol-http", "protocol-mysql", "protocol-redis"]
codec-json = ["dep:traffic-codec-json"]
codec-protobuf = ["dep:traffic-codec-protobuf"]
codec-string = ["dep:traffic-codec-string"]
codec-bytes = ["dep:traffic-codec-bytes"]
policy-unordered = ["dep:traffic-policy-unordered"]
policy-time = ["dep:traffic-policy-time"]
policy-identity = ["dep:traffic-policy-identity"]
policy-response-rewrite = ["dep:traffic-response-rewrite"]
protocol-http = ["dep:traffic-protocol-http"]
protocol-mysql = ["dep:traffic-protocol-mysql"]
protocol-redis = ["dep:traffic-protocol-redis"]
protocol-fixture = ["dep:traffic-protocol-fixture"]

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
traffic-value = { workspace = true }
traffic-policy = { workspace = true }
traffic-protocol = { workspace = true }
traffic-protocol-http = { workspace = true, optional = true }
traffic-protocol-mysql = { workspace = true, optional = true }
traffic-protocol-redis = { workspace = true, optional = true }
traffic-protocol-fixture = { workspace = true, optional = true }
traffic-codec-json = { workspace = true, optional = true }
traffic-codec-protobuf = { workspace = true, optional = true }
traffic-codec-string = { workspace = true, optional = true }
traffic-codec-bytes = { workspace = true, optional = true }
traffic-policy-unordered = { workspace = true, optional = true }
traffic-policy-time = { workspace = true, optional = true }
traffic-policy-identity = { workspace = true, optional = true }
traffic-response-rewrite = { workspace = true, optional = true }
