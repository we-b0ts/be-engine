[artifacts]
root_dir = "./.traffic-e2e/artifacts"

[comparison_recording]
# Comparison recording reuses http_gateway.matched_upstream as the baseline.
# Every configured HTTP gateway rule must use only GET, HEAD, or OPTIONS.
candidate_upstream = "http://127.0.0.1:6161"
# Optional: capture baseline -> candidate -> baseline so source-side time or
# mutable-data drift is visible to offline verification.
baseline_recheck = false
upstream_timeout_ms = 30000
max_in_flight = 256
summary_flush_interval_ms = 1000
max_request_bytes = 10485760
max_response_bytes = 10485760

[dns_mock]
enabled = true
listen = "127.0.0.153:15353"
upstream_dns = "10.10.10.10:53"
fake_cidr = "198.19.0.0/16"
ttl_seconds = 60
registry_path = "./.traffic-e2e/artifacts/fake_dns_registry.json"
# Exact names, suffixes starting with ".", and glob wildcards using "*" or "?"
# are returned from upstream DNS unchanged.
bypass_domains = [
  "doh.pub",
]

# Load exact backend hostnames from every Breeze snapshot file at startup.
# The configured directory must be visible inside the Recorder container.
# [[dns_mock.bypass_strategies]]
# strategy = "breeze"
# snapshot_dir = "/data1/breeze/snapshot"

[dns_mock.hosts]
"db-10-185-28-119.test" = ["10.185.28.119"]

[tcp_gateway]
enabled = true
listen = "127.0.0.1:15001"
# Maximum pending connections passed to listen(2); the kernel may cap it at
# net.core.somaxconn.
backlog = 65535
record_http = true
mitm_https = true
# Empty means attempt HTTPS MITM for all TLS-looking TCP streams.
https_ports = []

[tcp_gateway.protocol_detection]
# Cache protocols are identified from complete, high-confidence wire prefixes,
# so Redis and Memcached work on custom ports without per-service routing.
enabled = true
redis_port_hints = [6379]
memcached_port_hints = [11211]
kafka_port_hints = [9092]
# Kafka semantic recording v1 expects the E2E client profile to use
# security.protocol=PLAINTEXT, compression.type=none, enable.idempotence=false,
# and acks=1. Replay exposes one broker and one partition and does not support
# transactions, Admin APIs, failures, or compressed record batches.

# Overrides are an escape hatch for an ambiguous or intentionally raw endpoint.
# [[tcp_gateway.protocol_detection.overrides]]
# host = "cache.internal"
# port = 6380
# protocol = "redis" # redis | memcached | kafka | motan | raw

[http_response_rewrite]
# Response rewriting is opt-in. Recorder starts and manages kubectl proxy at
# the address configured by the plugin below.
enabled = false

[[http_response_rewrite.rules]]
name = "pluto-eci-kubeconfig"
authorities = ["cs.aliyuncs.com"]
methods = ["GET"]
# Exact path match. Keep the Pluto ECI cluster ID in the configured path.
path = "/api/v2/k8s/c142fe56e07d04a749c1630fb5f1b680b/user_config"
status_codes = [200]
content_types = ["application/json"]
# The plugin owns the fixed synthetic domain. Recorder starts and manages the
# configured kubectl binary using the original kubeconfig from this response.
plugin = { name = "pluto-eci-kubeconfig", kubectl_binary = "kubectl", proxy_listen = "127.0.0.1:8001" }

# Vintage naming responses contain RPC node IPs in a JSON string nested under
# the outer "body" field. This plugin replaces every selected node IP with a
# stable fake-DNS address so the later legacy Motan connection reaches the TCP
# gateway. Omitting services/clusters matches every value; add either field
# only when recording is intentionally limited to a known subset.
# [[http_response_rewrite.rules]]
# name = "vintage-motan"
# authorities = ["static.config.api.demo.test"]
# methods = ["GET"]
# path = "/naming/service"
# status_codes = [200]
# content_types = ["application/json"]
# plugin = { name = "vintage-naming" }

[udp_gateway]
# Records UDP datagrams sent to fake DNS targets, such as push metrics. UDP
# recording is side-effect capture; it does not wait for or synthesize replies.
enabled = true
listen = "127.0.0.1:15002"
# Default false keeps recording from emitting development metrics to real
# upstream collectors.
forward = false

[http_gateway]
enabled = true
listen = "0.0.0.0:17171"
matched_upstream = "http://127.0.0.1:7171"
# "upstream" preserves the existing forwarding behavior. Use
# "fixed_response" to answer fallback requests inside Recorder without
# starting a separate fallback service.
fallback_mode = "upstream"
fallback_upstream = "http://10.37.254.56:7171"
preserve_host = true

# Example in-process fallback. Uncomment this table and change fallback_mode
# to "fixed_response". Status is required; 201 is appropriate only when the
# response represents resource creation.
# [http_gateway.fixed_response]
# status = 200
# content_type = "application/json"
# headers = { x-recorder-fallback = "fixed" }
# body = '{"code":"xxx","msg":"xxx"}'

[http_gateway.ready]
# The recorder actively probes matched_upstream until this path returns the
# expected status, then closes the shared bootstrap dependency window. This
# bounds the startup portion of global-dependencies.jsonl. While the service is
# not ready, matched rule traffic is handled by the configured fallback
# strategy and no case is created.
enabled = true
path = "/"
success_status = 200
interval_ms = 1000

# Limit successfully published cases independently for each resolved case
# pattern in the current recorder run. Once a pattern reaches its limit,
# later matching requests use the fallback strategy without creating a case.
# Static paths use their exact URI path as the pattern.
[http_gateway.case_limits]
default = 100

# Dynamic overrides must exactly match an entry in case_path_patterns below.
[http_gateway.case_limits.overrides]
# "/api/example/*" = 20
# "/api/namespaces/**" = 50

# tcpcopy HTTP traffic matching rules. If no rules are configured, all gateway
# traffic not selected by exclude_rules is eligible for matching. Exclusions
# always take priority and use the fallback strategy without creating a case.
# At most one matched case is recorded at a time; overlapping eligible
# requests also use the fallback strategy.
[[http_gateway.exclude_rules]]
name = "exclude-health"
methods = ["GET"]
path_prefixes = ["/health", "/metrics"]
headers = {}

[[http_gateway.rules]]
name = "record-api"
methods = ["GET"]
path_prefixes = ["/api"]
# Host-wide exceptions are add-only recorder feedback. Add one only after
# source inspection proves the host belongs to an API-independent process-level
# task. Replay still treats unmatched target calls as dirty.
# BEGIN AI-MANAGED ALLOWED UNUSED HTTP HOSTS
allowed_unused_http_hosts = [
]
# END AI-MANAGED ALLOWED UNUSED HTTP HOSTS
# Keep project-specific patterns in the destination repository's recorder
# config. The recorded-E2E replay workflow can add safe patterns after it
# associates actual case URIs with source routes.
# '*' matches one non-empty path segment; a final '**' matches one or more
# remaining path segments.
# BEGIN AI-MANAGED CASE PATH PATTERNS
# source_revision = ""
case_path_patterns = [
  # "/api/example/*",
]
# END AI-MANAGED CASE PATH PATTERNS
headers = {}

[mysql]
# Applies to MySQL captured through dns_mock + tcp_gateway as well as the
# optional dedicated MySQL proxy. Default false keeps dependencies compact:
# mysql_response records one concatenated payload instead of raw packet details.
record_raw_packets = false

[recording]
max_body_bytes = 10485760
# Decoded HTTP case bodies may be larger than their compressed wire form.
# Omit this value to reuse max_body_bytes.
max_decoded_body_bytes = 33554432
# full: all run-level events; errors: diagnostic/audit events only; off: no traffic.jsonl.
traffic_jsonl = "full"
# JSONL writes are buffered and flushed at most this long after an active write.
jsonl_buffer_capacity_bytes = 262144
jsonl_flush_interval_ms = 1000
# Completed events move into this bounded queue before JSONL serialization and
# persistence so dependency writes do not delay dependency responses.
writer_queue_capacity = 65536
# Keep startup dependencies in bootstrap for this fixed interval after the
# readiness probe succeeds. Matching traffic continues to use the configured
# fallback until the interval ends.
post_ready_settle_ms = 10000
# Keep dependency admission open for a fixed interval after the HTTP response
# completes so synchronous server-side after-hooks can start. Set to 0 to close
# admission immediately when the response completes.
case_dependency_post_response_window_ms = 100
# After admission closes, wait at most this long for already accepted in-flight
# dependencies to complete before failing the case.
case_dependency_drain_timeout_ms = 5000
# On shutdown, stop admitting new cases and allow the active case to finish
# before any remaining staging case is failed.
shutdown_case_drain_timeout_ms = 5000
# unrestricted keeps existing forwarding behavior. block_known_writes rejects
# operations that the protocol classifiers identify as writes; unknown commands
# are still forwarded for compatibility.
access_policy = "unrestricted"
# Request headers listed here are stored as AES-256-GCM ciphertext and require
# TRAFFIC_E2E_ENCRYPTION_KEY_B64 during standard/comparison recording and
# replay. Request-side encryption takes precedence when a name also appears in
# redact_headers.
encrypt_request_headers = []
redact_headers = [
  "authorization",
  "cookie",
  "set-cookie",
  "proxy-authorization",
  "proxy-authenticate",
]

# Source-proven process work can be moved from case ownership into the shared
# Global replay pool. Use `config recorder plan|apply background-dependencies`;
# do not hand-edit generated rules. HTTP rules are response-independent.
# [[recording.background_dependencies]]
# name = "config-refresh"
# protocol = "http"
# authorities = ["config.api.demo.test"]
# methods = ["GET"]
# path_prefixes = ["/1/config/service"]
# response_role = "independent"
# source_revision = "0123456789abcdef"
# source_evidence = "src/config/refresh.rs:42 process-level scheduled refresh"

# Breeze-backed Memcached local-cache warm rules use a stable descriptor
# identity without its dynamic port. The tool resolves the business resource
# and writes this identity after validating finalized replay evidence.
# [[recording.background_dependencies]]
# name = "planet-video-cache-warm"
# protocol = "memcached"
# breeze_identity = "config.api.demo.test+3+config+v1+cache.pool+all:user-video@mc@cs"
# command = "get"
# key_start = 0
# key_end = 4095
# key_separator = "."
# key_suffix = "pl_video"
# Once HTTP readiness succeeds, fail Recorder readiness if this rule has not
# reached key_end - key_start + 1 completed matching exchanges within the
# configured timeout. No applied Memcached rule means no additional wait.
# initial_load_timeout_ms = 30000
# response_role = "runtime_state"
# source_revision = "0123456789abcdef"
# source_evidence = "TopUserServiceImpl.java:691 scheduled local-cache warm"

# BEGIN AI-MANAGED BACKGROUND DEPENDENCIES
# END AI-MANAGED BACKGROUND DEPENDENCIES

# MySQL-only first version of explicit write allowances. Every field is exact
# and all configured dimensions must match. operations, databases, and tables
# must be non-empty, and at least one route or target is required.
# [[recording.access_rules]]
# name = "allow-request-log-insert"
# effect = "allow"
# protocol = "mysql"
# operations = ["insert"] # insert | update | delete | replace | upsert
# routes = ["audit-db"]
# targets = [] # business host or host:port, for example mysql-log.internal:3306
# databases = ["pluto"]
# tables = ["request_log"]

[tls]
ca_cert_path = "./data/traffic-recorder-ca.pem"
ca_key_path = "./data/traffic-recorder-ca-key.pem"
