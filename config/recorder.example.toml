# a476fc4266ae78d866772b2c9089183e2f8a129f. Regenerate after source route
# changes. Of 135 dynamic routes, 131 are represented here; four Beego
# namespace catch-all routes are omitted because the recorder wildcard
# currently matches exactly one path segment. Exact static safeguards are
# ordered before broad wildcard patterns.
