# One typed policy for recording, classification, inputs and comparisons.
# Declare resource/response fields once; keep contextual effects in rules.
# Discover differences, plan with Source proof, then apply and verify Replay.
format: traffic-policy/v2
resources: {}
responses: {}
rules: []

