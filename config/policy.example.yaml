# One policy for recording, protocol ownership and global content formats.
# Empty initialization grants no value changes. Add formats after inspecting
# Source behavior, plan/apply with immutable evidence, then run genuine Replay.
# Source references and facts remain in the plan evidence, outside this runtime
# file. Rendering an annotated rule proposal writes only its declared behavior.
format: traffic-policy/v2
resources: {}
rules: []

# Example replacement for the empty document above:
# format: traffic-policy/v2
# json:
#   fields:
#     /task_id: {kind: identity, formats: [uuid]}
#     /updated_at: {kind: time, formats: [unix_seconds]}
#     /blocks/*/timestamp: {kind: time, formats: [unix_milliseconds]}
#     /members: {kind: unordered}
# mysql:
#   database: app
#   tables:
#     tasks:
#       pattern: tasks
#       fields:
#         id: {kind: identity, formats: [uuid]}
#     task_links:
#       pattern: task_links_*
#       fields:
#         owner_id: {kind: identity, formats: [uuid]}
# redis:
#   database: 0
#   keys:
#     task-run-monitor:v2:as-of: {kind: time, formats: [unix_seconds]}
# http:
#   headers:
#     x-amz-date: {kind: time, formats: [amz_date]}
# async_api:
#   POST /jobs:
#     when: {/background: true}
#     end:
#       - mysql: {sql: "UPDATE jobs SET status = 'completed' WHERE id = ?"}
#       - redis: {operation: DEL, key: 'job:finished:*'}
# rules: []
#
# JSON payloads are inferred across carriers. SQL temporal types use recorded
# metadata, without per-column time declarations. Native stateful Redis effects
# belong under redis.rules; JSON field formats remain in the single JSON map.
