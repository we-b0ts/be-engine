# Online baseline/candidate mirroring. Compare mode records both responses but
# does not compare them and does not initialize any dependency interception.
[compare]
baseline_upstream = "http://127.0.0.1:7171"
candidate_upstream = "http://127.0.0.1:6161"
upstream_timeout_ms = 30000
max_in_flight = 256
summary_flush_interval_ms = 1000
max_request_bytes = 10485760
max_response_bytes = 10485760
# Enabling this is necessary but not sufficient for POST/PUT/PATCH/DELETE:
# every mirrored method must also be explicitly listed in a matching rule.
allow_side_effecting_methods = false

[http_gateway]
enabled = true
listen = "0.0.0.0:18080"
preserve_host = true
# matched_upstream, fallback_upstream, and verified_excludes are ignored by
# compare mode.

[http_gateway.ready]
enabled = true
path = "/"
success_status = 200
interval_ms = 1000

[http_gateway.case_limits]
default = 100

[[http_gateway.exclude_rules]]
name = "exclude-health"
methods = ["GET"]
path_prefixes = ["/health"]

# Compare requires explicit named rules and explicit methods. With
# allow_side_effecting_methods=false only GET, HEAD, and OPTIONS are accepted.
[[http_gateway.rules]]
name = "pluto-api"
methods = ["GET"]
path_prefixes = ["/api"]
case_path_patterns = [
  "/api/resource/getprivkey/*",
  "/api/k8s/v1/namespaces/**",
]

[recording]
output_dir = "."
redact_headers = [
  "authorization",
  "cookie",
  "set-cookie",
  "proxy-authorization",
  "proxy-authenticate",
]
