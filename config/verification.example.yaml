version: 2
expected_response: assertions_only

# Copy this file to the target repository as .traffic-e2e/verification.yaml. Keep only
# evidence-backed rules for that target; never put recorded UUIDs, timestamps,
# response bodies, secrets, absolute case paths, or case-id exceptions here.
rules:
  - id: example-audit-insert
    case:
      method: GET
      path: /api/example/*
    protocol: mysql
    target:
      host: audit.example.test
      port: 3306
    mysql:
      command: COM_STMT_EXECUTE
      database: audit
      username: audit_writer
      sql: "INSERT INTO request_log_* (uuid, request_time) VALUES (?, ?)"
      params:
        0:
          bind: audit_id
          validate: uuid_v4
        1:
          time:
            relative_to: replay_now
            tolerance: 2s
            format: "%Y-%m-%d %H:%M:%S"
            timezone: "+08:00"

  - id: example-audit-update
    case:
      method: GET
      path: /api/example/*
    protocol: mysql
    target:
      host: audit.example.test
      port: 3306
    mysql:
      command: COM_STMT_EXECUTE
      database: audit
      username: audit_writer
      sql: "UPDATE request_log_* SET response_status=? WHERE uuid=?"
      params:
        1:
          ref: audit_id

  - id: example-signed-http-query
    case:
      method: GET
      path: /api/example/*
    protocol: http
    target:
      host: api.example.test
      port: 443
    http:
      method: GET
      path: /
      query:
        Signature:
          validate: non_empty
        SignatureNonce:
          validate: uuid_v4
        Timestamp:
          time:
            relative_to: replay_now
            tolerance: 2s

  # Memcached SET protobuf timestamps use an engine-owned ±5 second window.
  # The recorded timestamp is checked against its recorded SET event; the
  # target timestamp is checked against the SET observed during Replay.
  - id: example-user-cache-writeback
    protocol: memcached
    memcached:
      resource:
        kind: cache_service
        port: 11211
      command: set
      key:
        prefix: user-
        suffix: ''
      protobuf:
        timestamp_fields:
          50:
            mechanism: unix_seconds
            source_evidence: src/user_cache.rs:writeback sets loading_time from current time

# Add source-proven replay fields through `config replay` and comparison-only
# fields through `config comparison`. Comparison applies both sets.
response_rules:
  dynamic: {}
  unordered: {}
  # Motan byte-array responses may declare an inner protocol first, then add
  # reviewed protobuf repeated-field paths discovered by offline verification.
  motan: {}
  comparison:
    # before_or_after automatically enables source rechecks during record-comparison.
    source_match: before
    counter: {}
