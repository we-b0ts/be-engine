[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[package]
name = "traffic-e2e"
version = "0.1.0"
edition = "2024"
default-run = "traffic-e2e"

[dependencies]
traffic-e2e-app = { path = "crates/traffic-e2e-app" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
libc = "0.2"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
traffic-recorder = { path = "crates/traffic-recorder", features = ["test-support"] }
traffic-policy-execution = { path = "crates/traffic-policy-execution", features = ["test-support"] }
traffic-recording-store = { path = "crates/traffic-recording-store", features = ["test-support"] }
traffic-protocol-fixture = { path = "crates/traffic-protocol-fixture" }
traffic-contract = { path = "crates/traffic-contract", features = ["test-support"] }
traffic-protocol-mysql = { path = "crates/traffic-protocol-mysql", features = ["test-support"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "chrono", "bigdecimal"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
traffic-protocol-http = { path = "crates/traffic-protocol-http" }
base64 = "0.22"
flate2 = "1"
getrandom = "0.3"
hyper = { version = "1", features = ["client", "http1", "server"] }
tokio-rustls = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
