[package]
name = "traffic-e2e"
version = "0.1.0"
edition = "2024"
default-run = "traffic-e2e"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
brz-http-gateway = { version = "=0.1.6", features = ["redis-recording"] }
brz-redis = { version = "=0.0.10" }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
flate2 = "1"
getrandom = "0.3"
hmac = "0.12"
jsonwebtoken = { version = "9.3", default-features = false }
md-5 = "0.10"
serde_path_to_error = "0.1"
sha2 = "0.10"
subtle = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", features = ["http1", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
kafka-protocol = { version = "0.17", default-features = false, features = ["broker", "client", "messages_enums"] }
libc = "0.2"
motan-codec = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
motan-breeze = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
motan-hessian2 = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4", default-features = false }
motan-protocol = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
motan-simple = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
redis-protocol = { version = "6", features = ["bytes"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
sqlparser = { version = "0.62.0", default-features = false, features = ["std", "visitor"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webpki-roots = "1"
x509-parser = "0.16"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "chrono", "bigdecimal"] }
motan-json = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
