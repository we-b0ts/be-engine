[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[package]
name = "traffic-e2e"
version = "0.1.0"
edition = "2024"
default-run = "traffic-e2e"

[dependencies]
traffic-policy-generated = { path = "crates/traffic-policy-generated" }
traffic-policy-execution = { path = "crates/traffic-policy-execution" }
traffic-policy-document = { path = "crates/traffic-policy-document" }
traffic-policy-compiler = { path = "crates/traffic-policy-compiler" }
traffic-jwt = { path = "crates/traffic-jwt" }
traffic-policy-schema = { path = "crates/traffic-policy-schema", features = ["cli"] }
traffic-contract = { path = "crates/traffic-contract" }
traffic-policy-value = { path = "crates/traffic-policy-value" }
traffic-policy = { path = "crates/traffic-policy" }
traffic-value = { path = "crates/traffic-value" }
traffic-codec-protobuf = { path = "crates/traffic-codec-protobuf" }
traffic-extensions = { path = "crates/traffic-extensions" }
traffic-response-rewrite = { path = "crates/traffic-response-rewrite" }
traffic-model = { path = "crates/traffic-model" }
traffic-protocol = { path = "crates/traffic-protocol" }
traffic-protocol-http = { path = "crates/traffic-protocol-http" }
traffic-recording = { path = "crates/traffic-recording" }
traffic-replay = { path = "crates/traffic-replay" }
traffic-protocol-mysql = { path = "crates/traffic-protocol-mysql" }
traffic-protocol-redis = { path = "crates/traffic-protocol-redis" }
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
# Recorder leases remain compatible with gateway 0.2.14. Later SDKs pull
# brz-json/preserve_order into the engine and change persisted JSON identities.
brz-http-gateway = { version = "=0.2.12", features = ["redis-recording"] }
brz-redis = { version = "=0.0.16" }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
flate2 = "1"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
hmac = "0.12"
jsonwebtoken = { version = "9.3", default-features = false }
md-5 = "0.10"
serde_path_to_error = "0.1"
sha2 = "0.10"
subtle = "2"
http-body-util = "0.1"
http-body = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", features = ["http1", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
tower-service = "0.3"
kafka-protocol = { version = "0.17", default-features = false, features = ["broker", "client", "messages_enums"] }
libc = "0.2"
motan-codec = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
motan-breeze = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
motan-hessian2 = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4", default-features = false }
motan-protocol = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
motan-simple = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
redis-protocol = { version = "6", features = ["bytes"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
sqlparser = { version = "0.62.0", default-features = false, features = ["std", "visitor"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webpki-roots = "1"
x509-parser = "0.16"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
traffic-policy-execution = { path = "crates/traffic-policy-execution", features = ["test-support"] }
traffic-recording = { path = "crates/traffic-recording", features = ["test-support"] }
traffic-protocol-fixture = { path = "crates/traffic-protocol-fixture" }
traffic-contract = { path = "crates/traffic-contract", features = ["test-support"] }
traffic-protocol-mysql = { path = "crates/traffic-protocol-mysql", features = ["test-support"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "chrono", "bigdecimal"] }
motan-json = { git = "ssh://git@git.intra.demo.test:2222/platform/breeze/motan.git", tag = "v0.0.4" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
