# External packages
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
# Use the admission SDK without the gateway server's ordered JSON dependency.
brz-http-gateway = { version = "=0.2.16", default-features = false }
brz-redis = "=0.0.18"
bytes = "1"
chrono = "0.4"
clap = "4"
dotenvy = "0.15"
flate2 = "1"
form_urlencoded = "1"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
hyper = "1"
hyper-rustls = "0.27"
hyper-util = "0.1"
jsonwebtoken = { version = "9.3", default-features = false }
libc = "0.2"
md-5 = "0.10"
proc-macro2 = "1"
rcgen = "0.13"
redis-protocol = "6"
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = "1"
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlparser = { version = "0.62.0", default-features = false }
sqlx = { version = "0.8.6", default-features = false }
subtle = "2"
syn = "2"
tempfile = "3"
tokio = "1"
tokio-rustls = "0.26"
tokio-tungstenite = "0.29"
toml = "0.9"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = "1"
webpki-roots = "1"
x509-parser = "0.16"
zip = { version = "2", default-features = false }

[package]
name = "traffic-e2e"
version.workspace = true
edition.workspace = true
default-run = "traffic-e2e"

[dependencies]
traffic-e2e-app = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
dotenvy = { workspace = true }
libc = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
traffic-recorder = { workspace = true, features = ["test-support"] }
traffic-policy-execution = { workspace = true, features = ["test-support"] }
traffic-recording-store = { workspace = true, features = ["test-support"] }
traffic-protocol-fixture = { workspace = true }
traffic-contract = { workspace = true, features = ["test-support"] }
traffic-protocol-mysql = { workspace = true, features = ["test-support"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "chrono", "bigdecimal"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
traffic-protocol-http = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
getrandom = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "server"] }
tokio-rustls = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
