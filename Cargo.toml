[package]
name = "traffic-e2e"
version = "0.1.0"
edition = "2024"
default-run = "traffic-e2e"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
flate2 = "1"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", features = ["http1", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
kafka-protocol = { version = "0.17", default-features = false, features = ["broker", "client", "messages_enums"] }
libc = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
redis-protocol = { version = "6", features = ["bytes"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
syn = { version = "2", features = ["full", "visit"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webpki-roots = "1"
x509-parser = "0.16"

[dev-dependencies]
tempfile = "3"
