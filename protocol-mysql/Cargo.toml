[package]
name = "traffic-protocol-mysql"
version.workspace = true
edition.workspace = true

[features]
test-support = []

[dependencies]
traffic-contract = { workspace = true }
traffic-protocol-mysql-sql = { workspace = true }
traffic-value = { workspace = true }
traffic-policy-execution = { workspace = true }
traffic-policy-value = { workspace = true }

chrono = { workspace = true, features = ["serde"] }
traffic-model = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
sqlparser = { workspace = true, features = ["std", "visitor"] }
anyhow = { workspace = true }
bytes = { workspace = true }
rustls = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
traffic-protocol = { workspace = true }
traffic-replay = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "sync", "macros", "rt"] }
tracing = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
