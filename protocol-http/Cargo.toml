[package]
name = "traffic-protocol-http"
version.workspace = true
edition.workspace = true

[dependencies]
traffic-contract = { workspace = true }
traffic-policy-value = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
serde_json = { workspace = true }
traffic-model = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v4"] }
sha2 = { workspace = true }
traffic-protocol = { workspace = true }
traffic-replay = { workspace = true }
traffic-codec-json = { workspace = true }
anyhow = { workspace = true }
httparse = { workspace = true }
hyper-rustls = { workspace = true, features = ["http1", "webpki-roots"] }
tower-service = { workspace = true }
hyper = { workspace = true, features = ["server", "client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "client", "http1", "tokio"] }
http-body = { workspace = true }
http-body-util = { workspace = true }
form_urlencoded = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "net", "sync", "time"] }
tokio-rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
url = { workspace = true }

futures-util = { workspace = true, features = ["sink"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
