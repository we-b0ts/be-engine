[package]
name = "traffic-recorder"
version.workspace = true
edition.workspace = true

[features]
test-support = []

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time", "macros"] }
tracing = { workspace = true }
traffic-model = { workspace = true }
traffic-recording-store = { workspace = true }
traffic-protocol = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
